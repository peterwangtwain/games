<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101322">
<title>符文競境・雙人益智對決</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap');
:root{--bg:#101322;--panel:#191d31;--line:#41445e;--gold:#e9bd68;--cyan:#69d7d3;--pink:#ff829b;--text:#f2f1ec;--muted:#a3a8bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:'Noto Sans TC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#343658 0,#1b2034 38%,#101322 78%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background:linear-gradient(135deg,transparent 48%,#8b83bd12 49%,transparent 50%),linear-gradient(45deg,transparent 48%,#8b83bd12 49%,transparent 50%);background-size:54px 54px;mask-image:linear-gradient(#000,transparent 85%)}.app{width:min(1100px,100%);margin:auto;padding:25px 28px 28px;position:relative}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff18;padding-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.emblem{width:39px;height:39px;border:1px solid #e9bd6888;display:grid;place-items:center;color:var(--gold);font-size:22px;transform:rotate(45deg);background:#e9bd6809;box-shadow:0 0 20px #e9bd6822}.emblem span{transform:rotate(-45deg)}.brand-title{font-weight:700;letter-spacing:.16em;font-size:15px}.brand-sub{font:11px Rajdhani,sans-serif;color:#aeb3c7;letter-spacing:.18em;margin-top:2px}.badge{border:1px solid #ffffff23;border-radius:99px;padding:7px 13px;color:#c2c6d6;font-size:11px;letter-spacing:.1em}.hero{text-align:center;padding:27px 0 20px}.eyebrow{font:600 11px Rajdhani,sans-serif;color:var(--gold);letter-spacing:.35em}.hero h1{font-size:clamp(27px,5vw,40px);margin:5px 0 4px;letter-spacing:.12em;font-weight:700;background:linear-gradient(#fff8dd,#c9a965);background-clip:text;color:transparent;text-shadow:0 5px 20px #e7b85b20}.hero p{margin:0;color:var(--muted);font-size:13px;letter-spacing:.05em}.arena{display:grid;grid-template-columns:1fr 118px 1fr;align-items:center;gap:16px}.player{border:1px solid #ffffff1e;border-radius:14px;padding:16px 17px 17px;background:linear-gradient(145deg,#252a43eF,#171a2beF);box-shadow:0 20px 40px #0004,inset 0 1px #ffffff0b;position:relative;transition:.2s}.player:before{content:"";position:absolute;inset:0 18% auto;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}.player.p1{--accent:var(--cyan)}.player.p2{--accent:var(--pink)}.player.winner{border-color:var(--accent);box-shadow:0 0 30px color-mix(in srgb,var(--accent) 26%,transparent),0 20px 40px #0004}.player.loser{opacity:.48}.player-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.player-name{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:.1em}.orb{height:11px;width:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 13px var(--accent)}.keycap{font:600 10px Rajdhani,sans-serif;color:#b7bbcd;border:1px solid #ffffff20;border-radius:5px;padding:5px 7px;letter-spacing:.08em}.board-frame{padding:8px;border-radius:12px;background:linear-gradient(145deg,#555c79,#242941 45%,#65627d);box-shadow:0 12px 0 #101322,0 17px 22px #0008,inset 0 1px 3px #ffffff70;transform:perspective(800px) rotateX(2deg)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;border-radius:7px;background:radial-gradient(ellipse at 30% 15%,#383e5b,#1a1e31 75%);box-shadow:inset 0 4px 12px #090b16}.tile{aspect-ratio:1;position:relative;border:0;border-radius:8px;cursor:pointer;color:#f5f1e8;font:700 clamp(24px,4vw,38px) Rajdhani,sans-serif;text-shadow:0 2px 0 #0005;background:linear-gradient(145deg,#73809b,#454e6c 42%,#313852 72%,#252b40);box-shadow:0 5px 0 #1a2033,0 7px 10px #080a15a8,inset 0 1px 1px #fff9,inset 0 -3px 5px #171c2c;transition:transform .12s,filter .12s;user-select:none}.tile:before{content:"";position:absolute;inset:4px;border-radius:5px;border:1px solid #ffffff1d;pointer-events:none}.tile:not(.empty):hover{transform:translateY(-2px);filter:brightness(1.15)}.tile:not(.empty):active{transform:translateY(3px);box-shadow:0 2px 0 #1a2033,inset 0 1px 4px #1118}.tile.empty{background:linear-gradient(145deg,#161a2b,#20243a);box-shadow:inset 0 3px 9px #090b16;border:1px solid #ffffff08;cursor:default}.tile.empty:before{display:none}.statline{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 0;color:#aeb3c6;font-size:11px}.statline strong{font:600 18px Rajdhani,sans-serif;color:var(--text);margin-right:4px}.vs{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}.vs-mark{font:700 31px Rajdhani,sans-serif;color:#f0d18f;text-shadow:0 0 22px #e7bc6833}.vs-line{width:1px;height:35px;background:linear-gradient(transparent,#e9bd6880,transparent)}.clock{font:600 20px Rajdhani,sans-serif;color:#d1d3dd}.bottom{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-top:21px}.tip{display:flex;gap:10px;align-items:center;color:#adb2c6;font-size:11px;line-height:1.7}.tip-icon{font-size:17px;color:var(--gold)}.actions{display:flex;gap:9px}.btn{border:1px solid #e8bd6980;background:linear-gradient(135deg,#e5bd72,#b98a43);color:#191827;border-radius:7px;padding:11px 18px;font:700 12px 'Noto Sans TC',sans-serif;letter-spacing:.1em;cursor:pointer;box-shadow:0 4px 0 #76572e,0 8px 16px #0004;transition:.15s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #76572e}.btn.ghost{background:#20243a;color:#d8d9e0;border-color:#ffffff26;box-shadow:0 4px 0 #111322,0 8px 16px #0004}.result{position:fixed;inset:0;background:#080a12b8;backdrop-filter:blur(7px);display:none;place-items:center;padding:18px;z-index:4}.result.show{display:grid}.dialog{width:min(400px,100%);text-align:center;padding:31px 27px 25px;background:linear-gradient(145deg,#2c304a,#171a2b);border:1px solid #e9bd6870;border-radius:16px;box-shadow:0 30px 90px #000b}.trophy{font-size:41px;filter:drop-shadow(0 0 15px #f1c87155)}.dialog h2{margin:8px 0 5px;font-size:23px;letter-spacing:.12em;color:#f1d18b}.dialog p{margin:0 0 20px;color:#adb2c5;font-size:12px}.dialog .btn{min-width:150px}.mobile-controls{display:none}
@media(max-width:760px){.app{padding:17px 15px 24px}.arena{grid-template-columns:1fr 42px 1fr;gap:8px}.player{padding:11px 9px 12px;border-radius:10px}.board-frame{padding:5px;border-radius:8px}.board{gap:5px;padding:6px}.tile{border-radius:5px;font-size:clamp(19px,6vw,30px)}.tile:before{inset:2px}.keycap{display:none}.player-name{font-size:12px;gap:7px}.statline{font-size:9px;padding-top:11px}.statline strong{font-size:15px}.vs-mark{font-size:22px}.clock{font-size:14px}.vs-line{height:25px}.bottom{grid-template-columns:1fr;gap:12px}.actions{justify-content:center}.tip{justify-content:center}.badge{font-size:9px;padding:6px 9px}}
@media(max-width:440px){.arena{grid-template-columns:1fr 28px 1fr;gap:5px}.player{padding:9px 7px}.board{gap:4px;padding:5px}.tile{font-size:23px}.orb{width:8px;height:8px}.player-name{font-size:10px;letter-spacing:.04em}.statline{display:block;text-align:center;line-height:1.5}.statline span{display:block}.vs-mark{font-size:18px}.clock{font-size:12px}.hero{padding:20px 0 15px}.hero p{font-size:11px}.app{padding-inline:10px}}
</style></head>
<body><main class="app"><header class="top"><div class="brand"><div class="emblem"><span>✦</span></div><div><div class="brand-title">符 文 競 境</div><div class="brand-sub">RUNE DUEL · PUZZLE ARENA</div></div></div><div class="badge">雙人同場 · 即時競速</div></header>
<section class="hero"><div class="eyebrow">◆　古代遺跡的智慧試煉　◆</div><h1>符文滑塊對決</h1><p>移動浮空符文，依序排列 1 至 8，率先完成者獲勝。</p></section>
<section class="arena"><article class="player p1" id="player1"><div class="player-head"><div class="player-name"><i class="orb"></i>青曜先鋒</div><span class="keycap">W A S D</span></div><div class="board-frame"><div class="board" id="board1" aria-label="青曜先鋒的方陣"></div></div><div class="statline"><span>移動步數</span><span><strong id="moves1">0</strong>步</span></div></article>
<div class="vs"><div class="vs-line"></div><div class="vs-mark">VS</div><div class="clock" id="clock">00:00</div><div class="vs-line"></div></div>
<article class="player p2" id="player2"><div class="player-head"><div class="player-name"><i class="orb"></i>赤焰守衛</div><span class="keycap">↑ ← ↓ →</span></div><div class="board-frame"><div class="board" id="board2" aria-label="赤焰守衛的方陣"></div></div><div class="statline"><span>移動步數</span><span><strong id="moves2">0</strong>步</span></div></article></section>
<section class="bottom"><div class="tip"><span class="tip-icon">✧</span><span>點擊空格旁的符文即可移動。青曜使用 WASD，赤焰使用方向鍵。<br>也可以直接點擊自己的方陣操作。</span></div><div class="actions"><button class="btn ghost" id="shuffle">重新洗牌</button><button class="btn" id="newGame">開始新局</button></div></section></main>
<div class="result" id="result"><div class="dialog"><div class="trophy">🏆</div><h2 id="resultTitle">勝利！</h2><p id="resultText">你率先完成符文方陣。</p><button class="btn" id="playAgain">再戰一局</button></div></div>
<script>
(()=>{const goal=[1,2,3,4,5,6,7,8,0],dirs=[[-1,0],[1,0],[0,-1],[0,1]];let boards=[],counts=[0,0],start=0,timer=null,playing=false;const $=id=>document.getElementById(id);
function shuffled(){let a=goal.slice(),blank=8,prev=-1;for(let i=0;i<80;i++){let opts=dirs.map((d,k)=>({d,k,nr:Math.floor(blank/3)+d[1],nc:blank%3+d[0]})).filter(o=>o.nr>=0&&o.nr<3&&o.nc>=0&&o.nc<3&&o.k!==prev);let o=opts[Math.random()*opts.length|0];let n=o.nr*3+o.nc;[a[blank],a[n]]=[a[n],a[blank]];blank=n;prev=[1,0,3,2][o.k]}if(a.every((x,i)=>x===goal[i]))return shuffled();return a}
function newGame(){boards=[shuffled(),null];boards[1]=boards[0].slice();counts=[0,0];playing=true;start=Date.now();$('result').classList.remove('show');$('player1').classList.remove('winner','loser');$('player2').classList.remove('winner','loser');render();clearInterval(timer);timer=setInterval(tick,250);tick()}
function tick(){if(!playing)return;let s=Math.floor((Date.now()-start)/1000);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){for(let p=0;p<2;p++){let el=$('board'+(p+1));el.innerHTML='';boards[p].forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(!v?' empty':'');b.type='button';b.textContent=v||'';b.setAttribute('aria-label',v?'符文 '+v:'空格');b.onclick=()=>move(p,i);el.appendChild(b)});$('moves'+(p+1)).textContent=counts[p]}}
function move(p,i){if(!playing)return;let a=boards[p],z=a.indexOf(0);if(Math.abs((i%3)-(z%3))+Math.abs(Math.floor(i/3)-Math.floor(z/3))!==1)return;[a[i],a[z]]=[a[z],a[i]];counts[p]++;render();if(a.every((v,j)=>v===goal[j]))finish(p)}
function finish(p){playing=false;clearInterval(timer);$('player'+(p+1)).classList.add('winner');$('player'+(2-p)).classList.add('loser');$('resultTitle').textContent=(p===0?'青曜先鋒':'赤焰守衛')+' 獲勝！';$('resultText').textContent=`用 ${counts[p]} 步完成方陣，耗時 ${$('clock').textContent}。符文已歸位，勝負已定。`;$('result').classList.add('show')}
function key(e){let k=e.key.toLowerCase(),p,dx=0,dy=0;if(['w','a','s','d'].includes(k)){p=0;}else if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k)){p=1;e.preventDefault();if(k==='arrowup')dy=-1;if(k==='arrowdown')dy=1;if(k==='arrowleft')dx=-1;if(k==='arrowright')dx=1}else return;
// WASD moves the blank in the indicated direction by sliding the neighboring tile into it.
if(p===0){if(k==='w')dy=-1;if(k==='s')dy=1;if(k==='a')dx=-1;if(k==='d')dx=1}if(!playing)return;let z=boards[p].indexOf(0),r=Math.floor(z/3)+dy,c=z%3+dx;if(r<0||r>2||c<0||c>2)return;move(p,r*3+c)}
document.addEventListener('keydown',key);$('newGame').onclick=newGame;$('shuffle').onclick=newGame;$('playAgain').onclick=newGame;newGame();})();
</script></body></html>
